services:
  wwtp-scada:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wwtp-scada-demo
    restart: unless-stopped
    ports:
      - "${WWTP_PORT:-3001}:3001"
    environment:
      WWTP_HOST: "0.0.0.0"
      WWTP_PORT: "3001"
      WWTP_BASE_PATH: "${WWTP_BASE_PATH:-}"
      TZ: "Asia/Shanghai"
    volumes:
      - wwtp_data:/app/server/data

volumes:
  wwtp_data:
